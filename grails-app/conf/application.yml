---
info:
    app:
        name: '@info.app.name@'
        version: '@info.app.version@'
        grailsVersion: '@info.app.grailsVersion@'
grails:
    codegen:
        defaultPackage: grailsproject
    profile: web

---
grails:
    mime:
        types:
            all: '*/*'
            atom: application/atom+xml
            css: text/css
            csv: text/csv
            form: application/x-www-form-urlencoded
            html:
              - text/html
              - application/xhtml+xml
            js: text/javascript
            json:
              - application/json
              - text/json
            multipartForm: multipart/form-data
            pdf: application/pdf
            rss: application/rss+xml
            text: text/plain
            hal:
              - application/hal+json
              - application/hal+xml
            xml:
              - text/xml
              - application/xml
    views:
        gsp:
            encoding: UTF-8
            htmlcodec: xml
            codecs:
                scriptlet: html

---
hibernate:
    cache:
        queries: false
        use_second_level_cache: false
        use_query_cache: false
dataSource:
    pooled: true
    driverClassName: com.microsoft.sqlserver.jdbc.SQLServerDriver
    dialect: org.hibernate.dialect.SQLServerDialect
    username: '${DB_USERNAME}'
    password: '${DB_PASSWORD}'
    url: 'jdbc:sqlserver://${DB_HOST:localhost}\SQLEXPRESS;databaseName=${DB_NAME:test};encrypt=true;trustServerCertificate=true'
    dbCreate: update

environments:
    development:
        dataSource:
            dbCreate: update
    test:
        dataSource:
            dbCreate: create-drop
            driverClassName: org.h2.Driver
            dialect: org.hibernate.dialect.H2Dialect
            url: jdbc:h2:mem:testDb;LOCK_TIMEOUT=10000;DB_CLOSE_ON_EXIT=FALSE
    production:
        dataSource:
            dbCreate: none
            url: 'jdbc:sqlserver://${DB_HOST:localhost}:1433;databaseName=${DB_NAME:test};encrypt=true;trustServerCertificate=true'
            properties:
                jmxEnabled: true
                initialSize: 5
                maxActive: 50
                minIdle: 5
                maxIdle: 25
                maxWait: 10000
                maxAge: 600000
                timeBetweenEvictionRunsMillis: 5000
                minEvictableIdleTimeMillis: 60000
                validationQuery: SELECT 1
                validationQueryTimeout: 3
                validationInterval: 15000
                testOnBorrow: true
                testWhileIdle: true
                testOnReturn: false
                jdbcInterceptors: ConnectionState
                defaultTransactionIsolation: 2 # TRANSACTION_READ_COMMITTED
grails:
    plugin:
        springsecurity:
            userLookup:
                userDomainClassName: 'com.inventory.User'
                authorityJoinClassName: 'com.inventory.UserRole'
            authority:
                className: 'com.inventory.Role'
            controllerAnnotations:
                staticRules:
                    - pattern: '/'
                      access: ['permitAll']
                    - pattern: '/error'
                      access: ['permitAll']
                    - pattern: '/assets/**'
                      access: ['permitAll']
                    - pattern: '/login/**'
                      access: ['permitAll']
                    - pattern: '/logout/**'
                      access: ['permitAll']